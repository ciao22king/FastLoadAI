[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastloadai"
version = "0.2.0"
description = "Hardware-aware local model setup for llama.cpp"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["huggingface_hub>=0.24"]

[project.optional-dependencies]
huggingface = ["huggingface_hub>=0.24"]

[project.scripts]
fastloadai = "fastloadai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]