name: Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v"
        required: true
        default: "1.1.0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev
      - name: Build packages
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${VERSION#v}"
          ./packaging/build-packages.sh "$version" dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "FastLoadAI $TAG" --generate-notes
          gh release upload "$TAG" \
            dist/*.deb dist/*.tar.gz dist/SHA256SUMS --clobber

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apt
      - id: deployment
        uses: actions/deploy-pages@v4
